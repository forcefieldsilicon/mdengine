# Build the OpenMM flavour of the hosted-tier runner image and push to GHCR.
# One image for all NVIDIA architectures (OpenMM JITs CUDA kernels at runtime).
name: runner-openmm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        default: latest
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/runner-openmm
          push: true
          tags: |
            ghcr.io/forcefieldsilicon/mdengine-runner-openmm:${{ inputs.tag }}
            ghcr.io/forcefieldsilicon/mdengine-runner-openmm:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/forcefieldsilicon/mdengine
